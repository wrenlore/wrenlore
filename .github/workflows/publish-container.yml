name: Publish container image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Image version tag (for example 0.1.12)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            case "$REF_NAME" in
              v*) VERSION="${REF_NAME#v}" ;;
              *) echo "Release tag must start with v: $REF_NAME" >&2; exit 1 ;;
            esac
          else
            VERSION="$REQUESTED_VERSION"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            WRENLORE_GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/wrenlore/wrenlore:${{ steps.version.outputs.value }}
            ghcr.io/wrenlore/wrenlore:latest
            ghcr.io/wrenlore/wrenlore:sha-${{ github.sha }}
            docker.io/wrenlore/wrenlore:${{ steps.version.outputs.value }}
            docker.io/wrenlore/wrenlore:latest
            docker.io/wrenlore/wrenlore:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Verify published architectures
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          for image in ghcr.io/wrenlore/wrenlore docker.io/wrenlore/wrenlore; do
            manifest="$(docker buildx imagetools inspect "$image:$VERSION" --raw)"
            jq -e '
              ([.manifests[].platform | select(.os == "linux" and .architecture == "amd64")] | length >= 1)
              and
              ([.manifests[].platform | select(.os == "linux" and .architecture == "arm64")] | length >= 1)
            ' <<<"$manifest" >/dev/null
          done
