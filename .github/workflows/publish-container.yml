name: Publish container image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version tag (for example 0.1.12)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            ''|*[!0-9A-Za-z._-]*) echo "Invalid version tag: $VERSION" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            WRENLORE_GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/wrenlore/wrenlore:${{ inputs.version }}
            ghcr.io/wrenlore/wrenlore:latest
            ghcr.io/wrenlore/wrenlore:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/wrenlore/visibility" \
            -f visibility=public
