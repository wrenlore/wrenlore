name: AI regressions

on:
  pull_request:
    paths:
      - "apps/server/src/core/ai/**"
      - "apps/server/package.json"
      - "apps/client/src/wrenlore/ai/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ai-regressions.yml"
  push:
    branches: [master]
    paths:
      - "apps/server/src/core/ai/**"
      - "apps/server/package.json"
      - "apps/client/src/wrenlore/ai/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ai-regressions.yml"

permissions:
  contents: read

jobs:
  ai:
    name: AI runtime and URL retrieval regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter server exec jest --runInBand --testPathPatterns=core/ai
