name: AI regressions

on:
  pull_request:
    paths:
      - "apps/server/src/core/ai/**"
      - "apps/server/package.json"
      - "apps/client/src/wrenlore/ai/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ai-regressions.yml"
  push:
    branches: [master]
    paths:
      - "apps/server/src/core/ai/**"
      - "apps/server/package.json"
      - "apps/client/src/wrenlore/ai/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ai-regressions.yml"

permissions:
  contents: read

jobs:
  ai:
    name: AI runtime and URL retrieval regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter server exec jest --runInBand --testPathPatterns=core/ai
